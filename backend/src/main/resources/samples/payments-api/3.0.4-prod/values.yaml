name: payments-api
replicaCount: 3

image:
  repository: registry.example.com/payments-api
  tag: "3.0.4"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

# AKeyless secrets injector
podAnnotations:
  akeyless/enabled: "true"

resources:
  limits:
    memory: 2Gi
    cpu: "1"
  requests:
    memory: 1Gi
    cpu: 500m

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: payments-api

probes:
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 20
    periodSeconds: 10
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: PROD_REGION
    value: "eu-west-1"
  - name: DB_HOST
    value: "payments-db.prod.internal"
  - name: DB_USER
    value: "payments_app"
  - name: DB_PASSWORD
    value: "akeyless:/prod/payments/db-password"
  - name: API_TOKEN
    value: "akeyless:/prod/payments/api-token"
  - name: LOG_LEVEL
    value: "INFO"
  - name: CACHE_TTL_SECONDS
    value: "60"
