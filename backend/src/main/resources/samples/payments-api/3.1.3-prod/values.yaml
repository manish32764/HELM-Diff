name: payments-api
replicaCount: 3

image:
  repository: registry.example.com/payments-api
  tag: "3.1.3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: DB_HOST
    value: "payments-db.prod.internal"
  - name: DB_USER
    value: "payments_app"
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: payments-api-akeyless
        key: db-password
  - name: API_TOKEN
    value: "prod-tok-98765"
  - name: LOG_LEVEL
    value: "INFO"
  - name: CACHE_TTL_SECONDS
    value: "60"
  - name: FEATURE_FLAGS_URL
    value: "https://flags.prod.internal"
  - name: PROD_REGION
    value: "eu-west-1"
  - name: AUDIT_SINK
    value: "kafka://audit.prod.internal:9092"

probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
  startup:
    httpGet:
      path: /actuator/health/liveness
      port: http
    failureThreshold: 30
    periodSeconds: 5

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: payments-api

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi
