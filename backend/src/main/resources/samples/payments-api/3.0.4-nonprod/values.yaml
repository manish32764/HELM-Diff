name: payments-api
replicaCount: 1

image:
  repository: registry.example.com/payments-api
  tag: "3.0.4"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "nonprod"
  - name: DB_HOST
    value: "payments-db.nonprod.internal"
  - name: DB_USER
    value: "payments_app"
  - name: DB_PASSWORD
    value: "np-Passw0rd!"
  - name: API_TOKEN
    value: "np-token-12345"
  - name: LOG_LEVEL
    value: "DEBUG"
  - name: CACHE_TTL_SECONDS
    value: "60"

probes: {}

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
