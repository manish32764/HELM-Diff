spring.application.name=helm-compare
server.port=8080

# Where charts, analyses and audit history are stored (relative to the working directory)
helmcompare.data-dir=data
helmcompare.cors-origins=http://localhost:5173,http://127.0.0.1:5173

# Large portfolio uploads (hundreds of charts, folder uploads with many parts)
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=1024MB
server.tomcat.max-part-count=50000
server.tomcat.max-parameter-count=50000
server.tomcat.max-swallow-size=-1

spring.jackson.default-property-inclusion=non_null
